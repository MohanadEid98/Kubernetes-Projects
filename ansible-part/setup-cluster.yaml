---
# ==========================================================
# 1. System Hardening & Dependencies on ALL Nodes
# ==========================================================
- name: Phase 1 - Prepare All Nodes for Kubernetes
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Update apt cache & upgrade system packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Disable swap runtime
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Disable swap permanently in /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#\s]+\s+[^#\s]+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Load kernel modules for containerd & K8s
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Ensure kernel modules persist on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Set sysctl parameters for K8s networking
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
      notify: Apply sysctl

    - name: Install containerd runtime
      apt:
        name: containerd
        state: present

    - name: Ensure containerd config directory exists
      file:
        path: /etc/containerd
        state: directory

    - name: Configure containerd with SystemdCgroup
      shell: |
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
      notify: Restart containerd

    - name: Ensure keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Kubernetes GPG key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
        state: present
        filename: kubernetes

    - name: Install K8s tools (kubelet, kubeadm, kubectl)
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Freeze K8s packages version (apt-mark hold)
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

  handlers:
    - name: Apply sysctl
      command: sysctl --system

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes

# ==========================================================
# 2. Control Plane Initialization (Master Node Only)
# ==========================================================
- name: Phase 1 - Initialize Master Control Plane
  hosts: master
  become: true
  tasks:
    - name: Check if cluster is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadmin_conf

    - name: Initialize Kubernetes Master Node
      command: kubeadm init --pod-network-cidr=10.244.0.0/16
      when: not kubeadmin_conf.stat.exists

    - name: Setup kubeconfig directory for root
      file:
        path: /root/.kube
        state: directory

    - name: Copy admin.conf to root kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes

    - name: Generate dynamic kubeadm join command
      command: kubeadm token create --print-join-command
      register: join_command_raw

    - name: Register join command as fact
      set_fact:
        join_command: "{{ join_command_raw.stdout }}"

# ==========================================================
# 3. Join Workers & Deploy CNI Overlay
# ==========================================================
- name: Phase 1 - Join Worker Nodes to Cluster
  hosts: workers
  become: true
  tasks:
    - name: Check if worker is joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join Worker Node to Cluster
      command: "{{ hostvars[groups['master'][0]]['join_command'] }}"
      when: not kubelet_conf.stat.exists

- name: Phase 1 - Deploy Pod Networking Overlay
  hosts: master
  become: true
  tasks:
    - name: Deploy Flannel CNI
      command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml